name: Update NO LiMIT calendar

on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_ics.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add docs data
            git commit -m "Update calendar"
            git push
          else
            echo "No changes"
          fi
